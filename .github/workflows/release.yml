name: Release ReTheme WE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本，例如 0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: retheme-we-release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  windows:
    name: 构建、签名并发布 Windows 更新
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: 确定版本
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "无效版本：$version"
          }
          node scripts/sync-version.mjs $version
          node scripts/sync-version.mjs $version --check
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 生成本地功能构建配置
        run: node scripts/write-retheme-we-build-config.mjs

      - name: 安装依赖并测试
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建签名安装包并发布 GitHub Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v${{ steps.version.outputs.version }}
          releaseName: ReTheme WE v${{ steps.version.outputs.version }}
          releaseBody: |
            ReTheme WE v${{ steps.version.outputs.version }} Windows 自动更新包。
            更新包由 ReTheme WE 独立密钥签名，客户端会在安装前验证签名。
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          releaseAssetNamePattern: "ReTheme-WE-[platform]-[arch][setup][ext]"
          args: --bundles nsis

      - name: 清理生成配置
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath src-tauri/config/api.toml,src-tauri/config/security.toml -Force -ErrorAction SilentlyContinue
