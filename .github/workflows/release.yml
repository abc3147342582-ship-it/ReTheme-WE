name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate build configuration
        run: node scripts/write-build-config.mjs
        env:
          RETHEME_API_BASE_URL: https://theme.dux.cn/api/desktop/v1
          RETHEME_API_SECRET_ID: ${{ secrets.RETHEME_API_SECRET_ID }}
          RETHEME_API_SECRET_KEY: ${{ secrets.RETHEME_API_SECRET_KEY }}
          RETHEME_PACKAGE_KEY: ${{ secrets.RETHEME_PACKAGE_KEY }}
          RETHEME_LICENSE_PUBLIC_KEY: ${{ secrets.RETHEME_LICENSE_PUBLIC_KEY }}
          RETHEME_COMPATIBILITY_PUBLIC_KEY: ${{ secrets.RETHEME_COMPATIBILITY_PUBLIC_KEY }}
          RETHEME_THEME_PUBLIC_KEY: ${{ secrets.RETHEME_THEME_PUBLIC_KEY }}
      - name: Test frontend
        run: pnpm test
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Build and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: ReTheme v__VERSION__
          releaseBody: |
            ReTheme v__VERSION__

            - macOS: Apple Silicon and Intel
            - Windows: x64 bilingual installer
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Remove generated configuration
        if: always()
        shell: bash
        run: rm -f src-tauri/config/api.toml src-tauri/config/security.toml

  publish:
    name: Publish verified release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release download "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --pattern latest.json --dir release
          jq -e '
            .version == $version and
            (.platforms["darwin-aarch64"] | .url != "" and .signature != "") and
            (.platforms["darwin-x86_64"] | .url != "" and .signature != "") and
            (.platforms["windows-x86_64"] | .url != "" and .signature != "")
          ' --arg version "$version" release/latest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "${{ github.repository }}" --draft=false --latest
