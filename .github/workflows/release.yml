name: Release ReTheme WE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本，例如 0.2.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: retheme-we-release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  windows:
    name: 构建、签名并发布 Windows 更新
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.31.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: 安装并校验官方 NASM 3.02
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "nasm-3.02-win64.zip"
          $destination = Join-Path $env:RUNNER_TEMP "nasm-3.02"
          Invoke-WebRequest -Uri "https://www.nasm.us/pub/nasm/releasebuilds/3.02/win64/nasm-3.02-win64.zip" -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          $expectedHash = "161D0BFAFF53C2F9E9F3E69FD0672323EBABAFD1268976A5CEC11BE92A19AEE7"
          if ($actualHash -ne $expectedHash) {
            throw "NASM 3.02 压缩包校验失败：$actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $nasmDirectory = (Resolve-Path (Join-Path $destination "nasm-3.02")).Path
          $nasmDirectory >> $env:GITHUB_PATH
          "CMAKE_TOOLCHAIN_FILE=$((Resolve-Path 'scripts/cmake-windows-x64-toolchain.cmake').Path)" >> $env:GITHUB_ENV

      - name: 确定版本
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}" -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "无效版本：$version"
          }
          node scripts/sync-version.mjs $version
          node scripts/sync-version.mjs $version --check
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 生成本地功能构建配置
        run: node scripts/write-retheme-we-build-config.mjs

      - name: 安装依赖并测试
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: 构建签名 NSIS 安装包
        id: bundle
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          pnpm tauri build --bundles nsis 2>&1 | Tee-Object -FilePath tauri-build.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = (Get-Content -LiteralPath tauri-build.log | Select-Object -Last 80) -join "`n"
            Write-Error "Tauri NSIS 构建失败，末尾日志：`n$tail"
            exit $buildExitCode
          }

      - name: 生成更新清单与校验和
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $bundleDirectory = Resolve-Path "src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -LiteralPath $bundleDirectory -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "未找到 NSIS 安装包"
          }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) {
            throw "未找到 Tauri 更新签名：$signaturePath"
          }
          $releaseDirectory = New-Item -ItemType Directory -Path release-assets -Force
          $releaseInstaller = Join-Path $releaseDirectory "ReTheme-WE-windows-x64-setup.exe"
          $releaseSignature = "$releaseInstaller.sig"
          Copy-Item -LiteralPath $installer.FullName -Destination $releaseInstaller
          Copy-Item -LiteralPath $signaturePath -Destination $releaseSignature
          $installerHash = (Get-FileHash -LiteralPath $releaseInstaller -Algorithm SHA256).Hash
          $signatureHash = (Get-FileHash -LiteralPath $releaseSignature -Algorithm SHA256).Hash
          @(
            "$installerHash *ReTheme-WE-windows-x64-setup.exe"
            "$signatureHash *ReTheme-WE-windows-x64-setup.exe.sig"
          ) | Set-Content -LiteralPath (Join-Path $releaseDirectory "SHA256SUMS.txt") -Encoding utf8
          $signature = (Get-Content -LiteralPath $releaseSignature -Raw).Trim()
          $latest = [ordered]@{
            version = $version
            notes = "ReTheme WE $version：稳定单窗口启动，选中 Scene 同步到 Wallpaper Engine 桌面，并提高原生分辨率动态壁纸播放流畅度。"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = "https://github.com/${{ github.repository }}/releases/download/v$version/ReTheme-WE-windows-x64-setup.exe"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $releaseDirectory "latest.json") -Encoding utf8
          @"
          # ReTheme WE $version

          - 修复自动自检、主题应用与 Wallpaper Engine 应用并发打开多个 ChatGPT 页面。
          - 选择 Scene 时同步为 Wallpaper Engine 桌面壁纸；ChatGPT 最大化时配合应用规则只保留一个活动渲染实例。
          - Scene 保留 2561×1601 原生尺寸和 JPEG 80，本机原版 Scene 实测 15.0 FPS。
          - 安装模式为当前用户，不写入 WindowsApps，不关闭安全功能。

          Windows Authenticode 状态仍为 NotSigned；客户端自动更新会验证随附的 Tauri 更新签名。
          "@ | Set-Content -LiteralPath (Join-Path $releaseDirectory "RELEASE_NOTES.md") -Encoding utf8

      - name: 发布 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create "v$version" `
            "release-assets/ReTheme-WE-windows-x64-setup.exe" `
            "release-assets/ReTheme-WE-windows-x64-setup.exe.sig" `
            "release-assets/latest.json" `
            "release-assets/SHA256SUMS.txt" `
            --repo "${{ github.repository }}" `
            --title "ReTheme WE $version" `
            --notes-file "release-assets/RELEASE_NOTES.md" `
            --verify-tag

      - name: 清理生成配置
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath src-tauri/config/api.toml,src-tauri/config/security.toml -Force -ErrorAction SilentlyContinue
